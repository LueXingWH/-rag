<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园资料问答助手 · RAG Demo</title>
<style>
  :root{
    --bg:#0b1020; --panel:#141b30; --panel2:#1b2440; --line:#26314f;
    --txt:#e8edf9; --dim:#93a0bf; --accent:#5b8cff; --accent2:#22d3a6;
    --warn:#ffb020; --bad:#ff6b6b; --good:#34d399;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 15% -10%,#1a2450 0%,transparent 60%),var(--bg);
       color:var(--txt);font:15px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{padding:20px 26px 14px;border-bottom:1px solid var(--line);background:rgba(11,16,32,.85);
         position:sticky;top:0;backdrop-filter:blur(8px);z-index:9}
  h1{margin:0;font-size:19px;letter-spacing:.3px}
  h1 span{color:var(--accent)}
  .sub{color:var(--dim);font-size:12.5px;margin-top:4px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .badge{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
         background:var(--panel);color:var(--dim)}
  .badge b{color:var(--txt);font-weight:600}
  .badge.on{border-color:#1f6f5c;background:#0f2a24;color:var(--accent2)}
  .badge.off{border-color:#3b3f52;background:#1a1d29}
  main{max-width:960px;margin:0 auto;padding:22px 18px 80px}
  .askbar{display:flex;gap:10px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);
          padding:14px 0 6px}
  input[type=text]{flex:1;padding:13px 15px;border-radius:12px;border:1px solid var(--line);
        background:var(--panel);color:var(--txt);font-size:15px;outline:none}
  input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.15)}
  button{padding:13px 20px;border-radius:12px;border:0;background:var(--accent);color:#fff;
         font-size:15px;font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.5;cursor:progress}
  .examples{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 18px}
  .chip{font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
        background:var(--panel);color:var(--dim);cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--txt)}
  .qa{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:0 0 16px}
  .q{font-weight:600;margin-bottom:10px;font-size:16px}
  .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim);margin-bottom:12px}
  .pill{padding:3px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
  .pill.llm{border-color:#2f5cd0;color:#9dbaff}
  .pill.extractive{border-color:#8a6a12;color:#ffd479}
  .pill.refusal{border-color:#8a2f2f;color:#ff9d9d}
  .answer{white-space:pre-wrap;font-size:15.3px}
  .answer .cite{color:var(--accent);font-weight:700;cursor:pointer;padding:0 1px}
  .answer .cite:hover{text-decoration:underline}
  .confbar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:12px 0 4px;max-width:320px}
  .confbar i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good))}
  .srcs{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
  .srcs h4{margin:0 0 8px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.5px}
  .src{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px}
  .src .t{font-size:13px;color:var(--accent2);font-weight:600}
  .src .sn{font-size:13.5px;color:#cfd8ee;margin:6px 0 0}
  .src .mt{font-size:11.5px;color:var(--dim);margin-top:6px}
  details{margin-top:8px}
  summary{font-size:12.5px;color:var(--dim);cursor:pointer}
  details pre{white-space:pre-wrap;font-size:12.5px;color:#b9c4dd;background:#0e1426;border:1px solid var(--line);
              border-radius:9px;padding:11px;margin:8px 0 0;max-height:300px;overflow:auto}
  .trace{font-size:12px;color:var(--dim);margin-top:10px;border-left:2px solid var(--line);padding-left:10px}
  .err{color:var(--warn);font-size:12.5px;margin-top:8px}
  .empty{color:var(--dim);text-align:center;padding:40px 12px}
  .foot{color:#5d6884;font-size:11.5px;text-align:center;margin-top:26px}
</style>
</head>
<body>
<header>
  <h1>校园资料问答助手 <span>· RAG Demo</span></h1>
  <div class="sub">检索增强生成：先检索你的资料 → 再生成带引用的回答 → 没依据就明确拒答</div>
  <div class="badges" id="badges"></div>
</header>

<main>
  <div class="examples" id="examples"></div>
  <div id="feed"><div class="empty">输入一个问题，或点上面的示例开始 👆</div></div>
  <div class="askbar">
    <input type="text" id="q" placeholder="例如：挂科重修后还能申请推免吗？" autocomplete="off">
    <button id="send">提问</button>
  </div>
  <div class="foot">零依赖 · 离线可运行 · 引用可溯源 · 置信度低于阈值自动拒答</div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const EXAMPLES = [
  "推免的综合成绩由哪几部分构成？",
  "挂科重修后还能申请保研吗？",
  "本科生最多能借几本书，借期多久？",
  "在外面怎么用图书馆的知网？",
  "实验室 GPU 工作站单次最长能跑多久？",
  "挑战杯国家级一等奖有多少奖金？",
  "学校食堂的麻辣香锅多少钱？"
];
const MODE_LABEL = {llm:"大模型生成 · 严格接地", extractive:"离线抽取式降级", refusal:"拒答（证据不足）"};

function esc(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function withCites(text){
  return esc(text).replace(/\[(\d+)\]/g, '<span class="cite" data-i="$1">[$1]</span>');
}

async function loadBadges(){
  try{
    const r = await fetch("/api/info"); const d = await r.json();
    const llm = (d.config.llm_api_key ? "已配 key" : "未配 key");
    const b = [
      `<span class="badge">知识块 <b>${d.chunks}</b></span>`,
      `<span class="badge">文档 <b>${d.docs.length}</b></span>`,
      `<span class="badge ${d.semantic_enabled?'on':'off'}">语义向量 <b>${d.semantic_enabled?'开':'关'}</b></span>`,
      `<span class="badge ${llm==='已配 key'?'on':'off'}">大模型生成 <b>${llm==='已配 key'?'开':'离线降级'}</b></span>`,
      `<span class="badge">拒答阈值 <b>${d.config.answer_threshold}</b></span>`
    ];
    $("#badges").innerHTML = b.join("");
  }catch(e){ $("#badges").innerHTML = '<span class="badge off">无法读取 /api/info</span>'; }
}

function renderCard(q, d){
  const conf = Math.round((d.confidence||0)*100);
  const srcs = (d.sources||[]).map(s => `
    <div class="src">
      <div class="t">[${s.index}] ${esc(s.source)} · ${esc(s.heading)} <span style="color:var(--dim);font-weight:400">相关度 ${s.score}</span></div>
      <div class="sn">“${esc(s.snippet)}”</div>
      ${(d.trace&&d.trace.matched_terms&&d.trace.matched_terms.length)?`<div class="mt">命中词：${esc(d.trace.matched_terms.join(" / "))}</div>`:""}
      <details><summary>展开原文</summary><pre>${esc(s.text)}</pre></details>
    </div>`).join("");
  const tr = d.trace||{};
  return `
  <div class="qa">
    <div class="q">❓ ${esc(q)}</div>
    <div class="meta">
      <span class="pill ${d.mode}">${MODE_LABEL[d.mode]||d.mode}</span>
      <span class="pill">置信度 ${(d.confidence||0).toFixed(2)}</span>
      <span class="pill">检索 ${d.latency_ms||0} ms</span>
    </div>
    <div class="answer">${withCites(d.answer)}</div>
    <div class="confbar"><i style="width:${conf}%"></i></div>
    ${d.error?`<div class="err">⚠️ 已自动降级（${esc(d.error).slice(0,140)}）</div>`:""}
    ${srcs?`<div class="srcs"><h4>📎 引用来源（可展开核对原文）</h4>${srcs}</div>`:""}
    <div class="trace">检索轨迹：词法分 ${(tr.lexical_top||0).toFixed(2)} · 向量分 ${(tr.vector_top||0).toFixed(2)} ·
      语义通道 ${tr.semantic_enabled?"开启":"关闭"} · 命中词 ${(tr.matched_terms||[]).slice(0,8).join("/")||"—"}</div>
  </div>`;
}

async function ask(q){
  if(!q || !q.trim()) return;
  const feed = $("#feed");
  if(feed.querySelector(".empty")) feed.innerHTML = "";
  const btn = $("#send"); btn.disabled = true;
  const id = "c" + Date.now();
  feed.insertAdjacentHTML("afterbegin", `<div class="qa" id="${id}"><div class="q">❓ ${esc(q)}</div>
     <div class="meta"><span class="pill">检索中…</span></div></div>`);
  try{
    const r = await fetch("/api/ask", {method:"POST", headers:{"Content-Type":"application/json"},
                                       body: JSON.stringify({question:q})});
    const d = await r.json();
    if(d.error){ document.getElementById(id).innerHTML =
      `<div class="q">❓ ${esc(q)}</div><div class="err">服务端错误：${esc(d.error)}</div>`; }
    else { document.getElementById(id).outerHTML = renderCard(q, d); }
  }catch(e){
    document.getElementById(id).innerHTML = `<div class="q">❓ ${esc(q)}</div><div class="err">请求失败：${esc(e.message)}</div>`;
  }finally{ btn.disabled = false; $("#q").focus(); }
}

function bindCites(){
  document.addEventListener("click", (e)=>{
    const c = e.target.closest(".cite"); if(!c) return;
    const card = c.closest(".qa"); const i = c.dataset.i;
    const src = card && card.querySelectorAll(".src")[parseInt(i,10)-1];
    if(src){ src.scrollIntoView({behavior:"smooth", block:"center"});
             src.style.borderColor = "var(--accent)";
             setTimeout(()=>src.style.borderColor = "var(--line)", 1400); }
  });
}

(function init(){
  $("#examples").innerHTML = EXAMPLES.map(q=>`<span class="chip">${esc(q)}</span>`).join("");
  $("#examples").addEventListener("click", e=>{
    if(e.target.classList.contains("chip")){ $("#q").value = e.target.textContent; ask(e.target.textContent); }
  });
  $("#send").onclick = ()=> ask($("#q").value);
  $("#q").addEventListener("keydown", e=>{ if(e.key === "Enter"){ ask($("#q").value); $("#q").value=""; } });
  bindCites(); loadBadges();
})();
</script>
</body>
</html>
